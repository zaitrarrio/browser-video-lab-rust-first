version: '3'

vars:
  PYTHON: '{{default ".venv/bin/python" .PYTHON}}'
  NPM_CACHE: '{{default "/tmp/npm-cache" .NPM_CACHE}}'
  DISTILL_CONFIG: '{{default "python/longlive_distill/configs/browser-384m.yaml" .DISTILL_CONFIG}}'
  TRAIN_SPEC: '{{default "rust/config/browser-390m-umt5.json" .TRAIN_SPEC}}'
  TRAIN_OUT: '{{default "artifacts/longlive-browser-burn" .TRAIN_OUT}}'
  SAMPLE_OUT: '{{default "artifacts/sample.safetensors" .SAMPLE_OUT}}'
  # Quantization reads the trained Burn record; its spec must match the record.
  QUANT_SPEC: '{{default "rust/config/browser-390m-umt5.json" .QUANT_SPEC}}'
  CHECKPOINT: '{{default "artifacts/longlive-browser-burn/student.mpk" .CHECKPOINT}}'
  # Chunked-run budget, mirroring what the Kaggle kernel passes.
  CHUNK_STEPS: '{{default "20000" .CHUNK_STEPS}}'
  TARGET_STEPS: '{{default "200000" .TARGET_STEPS}}'
  MAX_SECONDS: '{{default "0" .MAX_SECONDS}}'

tasks:
  default:
    desc: List available tasks
    cmds: [task --list]
  setup:
    desc: Install browser dependencies
    cmds: ["npm install --cache {{.NPM_CACHE}} --ignore-scripts"]
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]
  setup:python:
    desc: Create the base Python environment
    cmds:
      - python3 -m venv .venv
      - '{{.PYTHON}} -m pip install --upgrade pip'
      - '{{.PYTHON}} -m pip install -r python/requirements-distill.txt'
    generates: [.venv/bin/python]
  setup:wan:
    desc: Install Wan and Pruna dependencies into the Python environment
    deps: [setup:python]
    cmds: ['{{.PYTHON}} -m pip install -r python/requirements-wan.txt']
  setup:rust:
    desc: Install Rust with rustup when cargo is unavailable
    cmds:
      - command -v cargo >/dev/null || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - rustup target add wasm32-unknown-unknown
      - command -v wasm-pack >/dev/null || cargo install wasm-pack --locked
  dev:
    desc: Start the WebGPU browser application
    deps: [setup]
    cmds: [npm run dev]
  check:
    desc: Run every local non-GPU validation
    deps: [typecheck, test, build, check:models, check:python]
  typecheck:
    cmds: [npm run typecheck]
  test:
    cmds: [npm test]
  build:
    cmds: [npm run build]
  check:models:
    cmds: [node scripts/check-models.mjs public/models/*/manifest.example.json]
  check:python:
    cmds: [python3 -m compileall -q python]
  distill:smoke:
    desc: Exercise the complete distillation loop with tiny synthetic models
    deps: [setup:python]
    cmds: ['{{.PYTHON}} -m longlive_distill.train --config python/longlive_distill/configs/smoke.yaml']
    env: {PYTHONPATH: python}
  distill:
    desc: Distill a configured LongLive teacher into the browser student
    deps: [setup:python]
    cmds: ['{{.PYTHON}} -m longlive_distill.train --config {{.DISTILL_CONFIG}}']
    env: {PYTHONPATH: python}
  distill:export:
    desc: Export a distilled browser student to ONNX
    deps: [setup:python]
    requires: {vars: [CHECKPOINT]}
    cmds: ['{{.PYTHON}} -m longlive_distill.export --config {{.DISTILL_CONFIG}} --checkpoint {{.CHECKPOINT}} --output artifacts/longlive-browser/denoiser.onnx']
    env: {PYTHONPATH: python}
  teacher:cache:
    desc: Run the optional official LongLive teacher once and create framework-neutral Safetensors shards
    deps: [setup:python]
    requires: {vars: [TEACHER_ADAPTER, DATASET]}
    cmds: ['{{.PYTHON}} -m longlive_distill.cache_teacher --adapter {{.TEACHER_ADAPTER}} --dataset {{.DATASET}} --output data/teacher-cache {{.CLI_ARGS}}']
    env: {PYTHONPATH: python}
  teacher:cache:wan21:
    desc: 'Plan B: cache the Wan2.1-1.3B teacher (Apache-2.0, CPU) from a caption dataset. Set DATASET (dir of .pt items from make_dataset).'
    deps: [setup:wan]
    requires: {vars: [DATASET]}
    cmds: ['{{.PYTHON}} -m longlive_distill.cache_teacher --adapter wan21_teacher_adapter:build_teacher --dataset {{.DATASET}} --output data/teacher-cache --device cpu --draws-per-clip 8 --relation-layers 6 {{.CLI_ARGS}}']
    env: {PYTHONPATH: python}
  teacher:cache:smoke:
    desc: 'CPU end-to-end proof (no GPU, no download): synthetic dataset -> toy Wan2.1 teacher cache -> Rust validate-cache'
    deps: [setup:python]
    cmds:
      - '{{.PYTHON}} -m longlive_distill.make_dataset --synthetic --output artifacts/wan-data --count 3 --seq 4 --teacher-width 4096 --student-width 16 --latent-shape 16 2 4 4'
      - '{{.PYTHON}} -m longlive_distill.cache_teacher --adapter wan21_teacher_adapter:build_teacher --adapter-arg toy=true --dataset artifacts/wan-data --output artifacts/wan-cache --draws-per-clip 4 --relation-layers 2'
      - cargo run --manifest-path rust/Cargo.toml -p video-cli -- validate-cache artifacts/wan-cache
    env: {PYTHONPATH: python}
  teacher:test:
    desc: Run the Python teacher-cache contract tests (CPU, no download)
    deps: [setup:python]
    cmds: ['{{.PYTHON}} -m pytest python/tests -q']
    env: {PYTHONPATH: python}
  onnx:student:
    desc: Export the distilled student to public/models/onnx for the ONNX Runtime Web demo
    deps: [setup:python]
    requires: {vars: [CHECKPOINT]}
    cmds:
      - '{{.PYTHON}} -m longlive_distill.export --config {{.DISTILL_CONFIG}} --checkpoint {{.CHECKPOINT}} --output public/models/onnx/denoiser.onnx'
      - cp public/models/onnx/manifest.example.json public/models/onnx/manifest.json
    env: {PYTHONPATH: python}
  rust:check:
    desc: Type-check the Rust-first workspace
    cmds: [cargo check --manifest-path rust/Cargo.toml --workspace]
  rust:test:
    desc: Test contracts, model utilities, and quantization
    cmds: [cargo test --manifest-path rust/Cargo.toml --workspace]
  rust:estimate:
    desc: Print the approximate browser-student parameter count
    cmds: [cargo run --manifest-path rust/Cargo.toml -p video-cli -- estimate rust/config/browser-390m.json]
  rust:validate-cache:
    desc: Validate framework-neutral teacher shards
    cmds: [cargo run --manifest-path rust/Cargo.toml -p video-cli -- validate-cache data/teacher-cache]
  rust:quantize:
    desc: Quantize a trained student record (student.bin/.mpk) to the Q8 bundle
    cmds: ["cargo run --release --manifest-path rust/Cargo.toml -p video-cli -- quantize --spec {{.QUANT_SPEC}} --weights {{.CHECKPOINT}} --output artifacts/student-q8 --bits 8"]
  rust:quantize:q4:
    desc: Create Q4 weights after the Q8 quality gate passes
    cmds: ["cargo run --release --manifest-path rust/Cargo.toml -p video-cli -- quantize --spec {{.QUANT_SPEC}} --weights {{.CHECKPOINT}} --output artifacts/student-q4 --bits 4"]
  rust:weights:q:
    desc: Install a quantized bundle (index.json + weights.q*) into the demo, preferring Q4
    cmds:
      - |
        src=artifacts/student-q4; [ -d "$src" ] || src=artifacts/student-q8
        test -d "$src" || { echo "no quantized bundle in artifacts/student-q4|q8 — run rust:quantize first" >&2; exit 1; }
        cp "$src"/index.json "$src"/weights.q* public/rust-video/
        cp {{.QUANT_SPEC}} public/rust-video/student-spec.json
  rust:wasm:
    desc: Build the Burn/WGPU browser module
    cmds:
      - wasm-pack build rust/crates/video-web --target web --out-dir ../../../public/rust-video
      - cp rust/config/browser-demo.json public/rust-video/student-spec.json
  rust:native:smoke:
    desc: Construct the compact student and run one native WGPU forward pass
    cmds: [cargo run --release --manifest-path rust/Cargo.toml -p video-native -- --spec rust/config/browser-smoke.json]
  rust:train:smoke:
    desc: Prove the PyTorch-free training loop end-to-end on CPU (synthetic cache → train → student.bin)
    cmds:
      - cargo run --manifest-path rust/Cargo.toml -p video-train -- synth-cache --spec rust/config/browser-smoke.json --output artifacts/synth-cache --shards 2 --frames 2 --height 4 --width 4 --seq 4 --teacher-text-width 32 --relation-layers 1
      - cargo run --manifest-path rust/Cargo.toml -p video-train -- train --spec rust/config/browser-smoke.json --cache artifacts/synth-cache --output artifacts/train-smoke --backend ndarray --steps 10 --lr 0.01 --log-every 2
  rust:train:
    desc: Distill the browser student from a real teacher cache, PyTorch-free. Pass extra flags after --
    requires: {vars: [CACHE]}
    cmds:
      - cargo run --release --manifest-path rust/Cargo.toml -p video-train -- train --spec {{.TRAIN_SPEC}} --cache {{.CACHE}} --output {{.TRAIN_OUT}} {{.CLI_ARGS}}
  rust:train:chunk:
    desc: Run one resumable chunk of a long run locally, exactly as the Kaggle kernel does
    requires: {vars: [CACHE]}
    cmds:
      - |
        resume=""
        [ -f {{.TRAIN_OUT}}/student.mpk ] && resume="--resume {{.TRAIN_OUT}}/student.mpk"
        cargo run --release --manifest-path rust/Cargo.toml -p video-train -- train \
          --spec {{.TRAIN_SPEC}} --cache {{.CACHE}} --output {{.TRAIN_OUT}} \
          --steps {{.CHUNK_STEPS}} --target-steps {{.TARGET_STEPS}} --max-seconds {{.MAX_SECONDS}} $resume {{.CLI_ARGS}}
      - cat {{.TRAIN_OUT}}/state.json
  rust:sample:
    desc: 'Integrate the trained student from noise to a latent (WEIGHTS, PROMPT=a cache shard). The step that makes "did it learn" something you can look at.'
    requires: {vars: [WEIGHTS]}
    cmds:
      - cargo run --release --manifest-path rust/Cargo.toml -p video-train -- sample --spec {{.TRAIN_SPEC}} --weights {{.WEIGHTS}} --output {{.SAMPLE_OUT}} {{.CLI_ARGS}}
  rust:eval:
    desc: 'Teacher parity (cosine / rel L2) for WEIGHTS over CACHE. Read it against `teacher:baseline` — never on its own.'
    requires: {vars: [WEIGHTS, CACHE]}
    cmds:
      - cargo run --release --manifest-path rust/Cargo.toml -p video-train -- eval --spec {{.TRAIN_SPEC}} --weights {{.WEIGHTS}} --cache {{.CACHE}} {{.CLI_ARGS}}
  teacher:baseline:
    desc: 'Trivial-predictor floor for CACHE. A flow-matching target correlates with the model input, so "echo the input" already scores ~0.45 cosine.'
    requires: {vars: [CACHE]}
    cmds: ['{{.PYTHON}} -m longlive_distill.parity_baseline --cache {{.CACHE}}']
    env: {PYTHONPATH: python}
  teacher:latents:
    desc: 'Build dataset items with REAL Wan latents (needs a CUDA GPU). Replaces make_dataset''s torch.randn stand-ins, which cannot teach coherent video.'
    deps: [setup:wan]
    requires: {vars: [CAPTIONS]}
    cmds: ['{{.PYTHON}} -m longlive_distill.make_wan_dataset --captions {{.CAPTIONS}} --output data/wan-latents --reference-dir artifacts/reference {{.CLI_ARGS}}']
    env: {PYTHONPATH: python}
  teacher:decode:
    desc: 'Decode a latent (sample or dataset item) to MP4 with the Wan VAE. Set LATENTS.'
    deps: [setup:wan]
    requires: {vars: [LATENTS]}
    cmds: ['{{.PYTHON}} -m longlive_distill.decode_latents --latents {{.LATENTS}} --output artifacts/decoded.mp4 {{.CLI_ARGS}}']
    env: {PYTHONPATH: python}
  probe:
    desc: 'Hours-not-days overfit probe: 4 clips -> cache -> train -> sample -> MP4. ARM=small|full, PHASE=data|check|cache|floor|train|sample|all. See docs/OVERFIT-PROBE.md.'
    cmds: ['ARM={{.ARM}} PHASE={{.PHASE}} MAX_SECONDS={{.PROBE_SECONDS}} bash scripts/overfit-probe.sh']
    vars:
      ARM: '{{default "small" .ARM}}'
      PHASE: '{{default "all" .PHASE}}'
      PROBE_SECONDS: '{{default "14400" .PROBE_SECONDS}}'
  probe:denoise:
    desc: 'One-step x0 reconstruction from a cache shard using the student''s own velocity — separates "cannot draw" from "sampler drifts". Set WEIGHTS, CACHE, SHARD.'
    requires: {vars: [WEIGHTS, CACHE]}
    cmds:
      - cargo run --release --features cuda --manifest-path rust/Cargo.toml -p video-train -- denoise --spec {{.TRAIN_SPEC}} --weights {{.WEIGHTS}} --cache {{.CACHE}} --shard {{.SHARD}} --output artifacts/denoise.safetensors --teacher-output artifacts/denoise-teacher.safetensors --backend cuda --precision f32 {{.CLI_ARGS}}
    vars: {SHARD: '{{default "0" .SHARD}}'}
  probe:targets:
    desc: 'Where the training signal lives: gradient budget and echo-residual by sigma band. No GPU, no model. Set CACHE.'
    requires: {vars: [CACHE]}
    cmds: ['{{.PYTHON}} -m longlive_distill.analyze_targets --cache {{.CACHE}} {{.CLI_ARGS}}']
    env: {PYTHONPATH: python}
  probe:closed-form:
    desc: 'How far the stored targets sit from (x_s - x0)/s — i.e. what a perfect memoriser could reach. Set CACHE, DATASET, DRAWS.'
    requires: {vars: [CACHE, DATASET, DRAWS]}
    cmds: ['{{.PYTHON}} -m longlive_distill.closed_form_target --cache {{.CACHE}} --dataset {{.DATASET}} --draws-per-clip {{.DRAWS}} {{.CLI_ARGS}}']
    env: {PYTHONPATH: python}
  probe:spectrum:
    desc: 'Student-vs-teacher velocity cosine by spatial frequency — the band round 6 found missing. Set SHARD_FILE and RECON.'
    requires: {vars: [SHARD_FILE, RECON]}
    cmds: ['{{.PYTHON}} python/longlive_distill/spectrum.py {{.SHARD_FILE}} {{.RECON}}']
  kaggle:dry-run:
    desc: Render the Kaggle training kernel and print its metadata without pushing
    cmds: [node scripts/kaggle-orchestrate.mjs --dry-run]
  rust:weights:
    desc: Install trained Burn weights (and their matching spec) into the demo bundle
    cmds:
      - cp {{.TRAIN_OUT}}/student.bin public/rust-video/student.bin
      - cp {{.TRAIN_SPEC}} public/rust-video/student-spec.json
  models:bundle:
    desc: Assemble the publishable browser model bundle (WASM runtime + any Q8/Q4 weights)
    deps: [rust:wasm]
    cmds:
      - rm -rf model-bundle && mkdir -p model-bundle/rust-video
      - cp -r public/rust-video/. model-bundle/rust-video/
      - cp rust/config/browser-390m.json model-bundle/student-spec.json
      - test -d artifacts/student-q8 && cp -r artifacts/student-q8 model-bundle/student-q8 || true
      - test -d artifacts/student-q4 && cp -r artifacts/student-q4 model-bundle/student-q4 || true
      - test -f {{.TRAIN_OUT}}/student.bin && cp {{.TRAIN_OUT}}/student.bin model-bundle/rust-video/student.bin && cp {{.TRAIN_SPEC}} model-bundle/rust-video/student-spec.json || true
      # Serve the quantized bundle to the demo runtime too (rust-video.ts prefers
      # it over student.bin); Q4 wins when both exist.
      - src=artifacts/student-q4; [ -d "$src" ] || src=artifacts/student-q8; test -d "$src" && cp "$src"/index.json "$src"/weights.q* model-bundle/rust-video/ || true
      - task: models:manifest
  models:manifest:
    desc: Write a content-addressed (sha256) manifest of the model bundle for browser caching
    cmds: [node scripts/model-manifest.mjs model-bundle]
  smash:wan:
    desc: Compress Wan 2.1 1.3B with Pruna Smash
    deps: [setup:wan]
    cmds: ['{{.PYTHON}} python/smash_wan21.py {{.CLI_ARGS}}']
  benchmark:wan:
    desc: Benchmark a compressed Wan model; pass its path after --
    deps: [setup:wan]
    cmds: ['{{.PYTHON}} python/benchmark_wan21.py {{.CLI_ARGS}}']
  package:
    desc: Build the source archive
    cmds:
      - tar --exclude='__pycache__' --exclude='target' -czf /tmp/browser-video-lab.tar.gz README.md Taskfile.yml package.json package-lock.json tsconfig.json vite.config.ts index.html src public python rust scripts .gitignore
      - mv /tmp/browser-video-lab.tar.gz browser-video-lab.tar.gz
  clean:
    desc: Remove reproducible build and cache outputs
    cmds: [rm -rf dist .pytest_cache python/longlive_distill/__pycache__ model-bundle model-bundle.tar.gz public/rust-video]
