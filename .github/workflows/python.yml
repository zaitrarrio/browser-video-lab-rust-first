name: Python

# Gates the PyTorch-free teacher-cache contract on CPU: the toy Wan2.1 teacher,
# the generalized cache builder, and make_dataset must keep producing shards that
# match the video-contract the Rust trainer reads. No GPU, no model download.
on:
  push:
    paths: ["python/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/python.yml"]
  workflow_dispatch:

jobs:
  teacher-cache:
    name: Teacher-cache contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU deps
        # CPU-only torch keeps the job small; the tests need nothing else heavy.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install safetensors numpy pytest
      - name: Teacher-cache contract tests
        env:
          PYTHONPATH: python
        run: pytest python/tests -q
